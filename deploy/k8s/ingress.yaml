# Routes http://uptime.local to the API Service.
# On minikube: minikube addons enable ingress, then map uptime.local to the
# minikube IP in /etc/hosts (see deploy/k8s/README.md).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: uptime
spec:
  ingressClassName: nginx
  rules:
    - host: uptime.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
