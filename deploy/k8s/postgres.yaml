# PostgreSQL as a StatefulSet with a PersistentVolumeClaim, so data survives
# pod restarts and rescheduling. (In production you'd usually use a managed
# database such as RDS, or an operator like CloudNativePG for replication,
# failover and backups. That comes in later phases.)
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  # Headless: DNS "postgres" resolves straight to the pod IP. A StatefulSet
  # needs a headless "governing" Service for its stable pod names.
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      terminationGracePeriodSeconds: 60  # let PostgreSQL shut down cleanly
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef: {name: uptime-config, key: DB_USER}
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef: {name: uptime-config, key: DB_NAME}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: uptime-secrets, key: POSTGRES_PASSWORD}
            # A subdirectory, because the volume's root may contain
            # lost+found, which initdb refuses to initialise over.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          # Ready = accepting TCP connections. During first-time init
          # PostgreSQL only listens on a Unix socket, so this stays not-ready
          # until initialisation has finished.
          readinessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
