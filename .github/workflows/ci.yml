# CI/CD pipeline
#
# Pull request:  lint + tests -> build image -> vulnerability scan   (nothing is published)
# Push to main:  the same, then push the image to GHCR tagged with the commit SHA
#
# Image: ghcr.io/<owner>/<repo>:<short-sha>   e.g. ghcr.io/4016sw/uptime-platform:a1b2c3d

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # "Run workflow" button in the Actions tab

# A newer push to the same branch/PR cancels the older, still-running pipeline.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; the image job asks for more only where needed.
permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests (pytest)
        run: pytest -v

  image:
    name: Build, scan and publish image
    needs: test   # never build an image from code that fails its tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed to push to GitHub Container Registry
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Works out image tags and OCI labels (source repo, commit, created date).
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short,prefix=
            type=ref,event=branch
            type=ref,event=pr

      # 1) Build locally first so the image can be scanned before anything is published.
      - name: Build image (for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: uptime-platform:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2) Report HIGH and CRITICAL vulnerabilities in the job log (does not fail).
      - name: Vulnerability report (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: uptime-platform:scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      # 3) Gate: fail the pipeline on CRITICAL vulnerabilities that have a fix available.
      - name: Vulnerability gate (Trivy, CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: uptime-platform:scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # temporary token GitHub creates for each run

      # 4) Push the scanned image. Layers come from the cache, so this is fast.
      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Published image"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
